name: careconnect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  geocoding: ^3.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/careconnect_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/careconnect_icon.png"
  adaptive_icon_background: "#0F2342"
  adaptive_icon_foreground: "assets/careconnect_icon.png"